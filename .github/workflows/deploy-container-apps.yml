name: Deploy To Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  API_APP_NAME: pharma-api
  FRONTEND_APP_NAME: pharma-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set metadata
        id: meta
        shell: bash
        run: |
          echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        shell: bash
        env:
          API_IMAGE: docker.io/${{ secrets.DOCKERHUB_API_IMAGE }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          docker build \
            -f src/PharmaTraining.Api/Dockerfile \
            -t "$API_IMAGE:$SHA_TAG" \
            -t "$API_IMAGE:latest" \
            .

          docker push "$API_IMAGE:$SHA_TAG"
          docker push "$API_IMAGE:latest"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Container Apps environment exists
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
          AZURE_CONTAINERAPPS_ENV: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
        run: |
          az extension add --name containerapp --upgrade

          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION"

          if ! az containerapp env show --name "$AZURE_CONTAINERAPPS_ENV" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp env create \
              --name "$AZURE_CONTAINERAPPS_ENV" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION"
          fi

      - name: Deploy API container app
        id: deploy_api
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPPS_ENV: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          API_IMAGE: docker.io/${{ secrets.DOCKERHUB_API_IMAGE }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          API_CONNECTION_STRING: ${{ secrets.API_CONNECTION_STRING }}
          API_JWT_SECRET: ${{ secrets.API_JWT_SECRET }}
          API_JWT_ISSUER: ${{ secrets.API_JWT_ISSUER }}
          API_JWT_AUDIENCE: ${{ secrets.API_JWT_AUDIENCE }}
          API_JWT_EXPIRES_MINUTES: ${{ secrets.API_JWT_EXPIRES_MINUTES }}
          AZURE_BLOB_CONNECTION_STRING: ${{ secrets.AZURE_BLOB_CONNECTION_STRING }}
          AZURE_BLOB_CONTAINER: ${{ secrets.AZURE_BLOB_CONTAINER }}
        run: |
          if ! az containerapp show --name "$API_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp create \
              --name "$API_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENV" \
              --image "$API_IMAGE:$SHA_TAG" \
              --ingress external \
              --target-port 8080 \
              --min-replicas 0 \
              --max-replicas 1 \
              --registry-server docker.io \
              --registry-username "$DOCKERHUB_USERNAME" \
              --registry-password "$DOCKERHUB_TOKEN" \
              --secrets \
                connstr="$API_CONNECTION_STRING" \
                jwt-secret="$API_JWT_SECRET" \
                blob-conn="$AZURE_BLOB_CONNECTION_STRING" \
              --env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                ConnectionStrings__DefaultConnection=secretref:connstr \
                Jwt__Secret=secretref:jwt-secret \
                Jwt__Issuer="$API_JWT_ISSUER" \
                Jwt__Audience="$API_JWT_AUDIENCE" \
                Jwt__ExpiresMinutes="$API_JWT_EXPIRES_MINUTES" \
                AzureBlob__ConnectionString=secretref:blob-conn \
                AzureBlob__ContainerName="$AZURE_BLOB_CONTAINER" \
                Cors__AllowedOrigins=https://example.invalid
          else
            az containerapp secret set \
              --name "$API_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --secrets \
                connstr="$API_CONNECTION_STRING" \
                jwt-secret="$API_JWT_SECRET" \
                blob-conn="$AZURE_BLOB_CONNECTION_STRING"

            az containerapp update \
              --name "$API_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$API_IMAGE:$SHA_TAG" \
              --set-env-vars \
                ASPNETCORE_ENVIRONMENT=Production \
                ConnectionStrings__DefaultConnection=secretref:connstr \
                Jwt__Secret=secretref:jwt-secret \
                Jwt__Issuer="$API_JWT_ISSUER" \
                Jwt__Audience="$API_JWT_AUDIENCE" \
                Jwt__ExpiresMinutes="$API_JWT_EXPIRES_MINUTES" \
                AzureBlob__ConnectionString=secretref:blob-conn \
                AzureBlob__ContainerName="$AZURE_BLOB_CONTAINER"
          fi

          API_FQDN=$(az containerapp show \
            --name "$API_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "api_url=https://$API_FQDN" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        shell: bash
        env:
          FRONTEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_FRONTEND_IMAGE }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          API_PUBLIC_URL: ${{ steps.deploy_api.outputs.api_url }}
        run: |
          docker build \
            -f new_frontend_pharmacy/Dockerfile.prod \
            --build-arg VITE_API_URL="$API_PUBLIC_URL" \
            -t "$FRONTEND_IMAGE:$SHA_TAG" \
            -t "$FRONTEND_IMAGE:latest" \
            new_frontend_pharmacy

          docker push "$FRONTEND_IMAGE:$SHA_TAG"
          docker push "$FRONTEND_IMAGE:latest"

      - name: Deploy frontend container app
        id: deploy_frontend
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINERAPPS_ENV: ${{ secrets.AZURE_CONTAINERAPPS_ENV }}
          FRONTEND_IMAGE: docker.io/${{ secrets.DOCKERHUB_FRONTEND_IMAGE }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if ! az containerapp show --name "$FRONTEND_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp create \
              --name "$FRONTEND_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --environment "$AZURE_CONTAINERAPPS_ENV" \
              --image "$FRONTEND_IMAGE:$SHA_TAG" \
              --ingress external \
              --target-port 80 \
              --min-replicas 0 \
              --max-replicas 1 \
              --registry-server docker.io \
              --registry-username "$DOCKERHUB_USERNAME" \
              --registry-password "$DOCKERHUB_TOKEN"
          else
            az containerapp update \
              --name "$FRONTEND_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$FRONTEND_IMAGE:$SHA_TAG"
          fi

          FRONTEND_FQDN=$(az containerapp show \
            --name "$FRONTEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "frontend_url=https://$FRONTEND_FQDN" >> "$GITHUB_OUTPUT"

      - name: Lock API CORS to frontend origin
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          FRONTEND_PUBLIC_URL: ${{ steps.deploy_frontend.outputs.frontend_url }}
          MANUAL_CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          if [ -n "$MANUAL_CORS_ALLOWED_ORIGINS" ]; then
            FINAL_ORIGINS="$MANUAL_CORS_ALLOWED_ORIGINS"
          else
            FINAL_ORIGINS="$FRONTEND_PUBLIC_URL"
          fi

          az containerapp update \
            --name "$API_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --set-env-vars Cors__AllowedOrigins="$FINAL_ORIGINS"

      - name: Print deployment URLs
        shell: bash
        env:
          API_PUBLIC_URL: ${{ steps.deploy_api.outputs.api_url }}
          FRONTEND_PUBLIC_URL: ${{ steps.deploy_frontend.outputs.frontend_url }}
        run: |
          echo "API URL: $API_PUBLIC_URL"
          echo "Frontend URL: $FRONTEND_PUBLIC_URL"
